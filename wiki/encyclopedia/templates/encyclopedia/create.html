{% extends "encyclopedia/layout.html" %}

{% block title %}
    Create
{% endblock %}

{% block body %}
    <form action="{% url 'create' %}" method="POST" >
        {% csrf_token %}
        <input type="text" name="title" placeholder="Title">
        <br>
        <input type="textarea" name="content" placeholder="Content">
        <br>
        <button type="submit">Create</button>
    </form>
{% endblock %}
