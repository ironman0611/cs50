{% extends "mail/layout.html" %}
{% load static %}

{% block body %}
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <i class="bi bi-envelope-fill me-2"></i>Mail
        </a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text me-3">
                <i class="bi bi-person-circle me-1"></i>{{ request.user.email }}
            </span>
            <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">
                <i class="bi bi-box-arrow-right me-1"></i>Log Out
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div class="card">
                <div class="card-body p-0">
                    <div class="list-group list-group-flush">
                        <button class="list-group-item list-group-item-action d-flex align-items-center" id="inbox">
                            <i class="bi bi-inbox me-2"></i>Inbox
                        </button>
                        <button class="list-group-item list-group-item-action d-flex align-items-center" id="compose">
                            <i class="bi bi-pencil-square me-2"></i>Compose
                        </button>
                        <button class="list-group-item list-group-item-action d-flex align-items-center" id="sent">
                            <i class="bi bi-send me-2"></i>Sent
                        </button>
                        <button class="list-group-item list-group-item-action d-flex align-items-center" id="archived">
                            <i class="bi bi-archive me-2"></i>Archived
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10">
            <!-- Emails View -->
            <div id="emails-view" class="d-none">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0" id="mailbox-title">Inbox</h4>
                    </div>
                    <div class="card-body p-0">
                        <div id="emails-list">
                            <!-- Emails will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Compose View -->
            <div id="compose-view" class="d-none">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">
                            <i class="bi bi-pencil-square me-2"></i>New Email
                        </h4>
                    </div>
                    <div class="card-body">
                        <form id="compose-form">
                            <div class="mb-3">
                                <label for="compose-sender" class="form-label">From</label>
                                <input type="email" class="form-control" id="compose-sender" value="{{ request.user.email }}" disabled>
                            </div>
                            <div class="mb-3">
                                <label for="compose-recipients" class="form-label">To</label>
                                <input type="email" class="form-control" id="compose-recipients" placeholder="Enter recipient email addresses (comma-separated)" required>
                            </div>
                            <div class="mb-3">
                                <label for="compose-subject" class="form-label">Subject</label>
                                <input type="text" class="form-control" id="compose-subject" placeholder="Enter subject">
                            </div>
                            <div class="mb-3">
                                <label for="compose-body" class="form-label">Message</label>
                                <textarea class="form-control" id="compose-body" rows="10" placeholder="Enter your message"></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-send me-1"></i>Send
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="load_mailbox('inbox')">
                                    <i class="bi bi-x me-1"></i>Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
    <script src="{% static 'mail/inbox.js' %}"></script>
{% endblock %}
