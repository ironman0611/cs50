{% extends "auctions/layout.html" %}

{% block body %}
    <h2 class="mb-3">Categories</h2>
    <div class="list-group">
        {% for category in categories %}
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" href="{% url 'category' category %}">
                <span>{{ category }}</span>
                <span class="badge badge-primary badge-pill">View</span>
            </a>
        {% empty %}
            <div class="alert alert-secondary">No categories available.</div>
        {% endfor %}
    </div>
{% endblock %}
