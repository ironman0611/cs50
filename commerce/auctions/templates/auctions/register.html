{% extends "auctions/layout.html" %}

{% block body %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h4 mb-4">Register</h2>
                    {% if message %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endif %}
                    <form action="{% url 'register' %}" method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input id="username" class="form-control" autofocus type="text" name="username" placeholder="Username">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input id="email" class="form-control" type="email" name="email" placeholder="Email Address">
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input id="password" class="form-control" type="password" name="password" placeholder="Password">
                        </div>
                        <div class="form-group">
                            <label for="confirmation">Confirm Password</label>
                            <input id="confirmation" class="form-control" type="password" name="confirmation" placeholder="Confirm Password">
                        </div>
                        <button class="btn btn-primary btn-block" type="submit">Register</button>
                    </form>
                    <div class="mt-3 text-muted">
                        Already have an account? <a href="{% url 'login' %}">Log in here</a>.
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
