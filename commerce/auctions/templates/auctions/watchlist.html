{% extends "auctions/layout.html" %}

{% block body %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Watchlist</h2>
    </div>
    <div class="row">
        {% for listing in watchlist %}
            <div class="col-sm-6 col-lg-4 mb-4">
                <div class="card h-100 shadow-sm">
                    {% if listing.image_url %}
                        <img class="card-img-top" src="{{ listing.image_url }}" alt="{{ listing.title }}" style="height: 180px; object-fit: cover;">
                    {% endif %}
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ listing.title }}</h5>
                        <div class="mt-auto d-flex justify-content-between align-items-center">
                            <a class="btn btn-sm btn-outline-primary" href="{% url 'listing' listing.id %}">View Listing</a>
                            <form action="{% url 'watchlist' %}" method="post" class="m-0">
                                {% csrf_token %}
                                <input type="hidden" name="listing_id" value="{{ listing.id }}"/>
                                <button class="btn btn-sm btn-outline-danger" type="submit" name="button" value="Remove from Watchlist">Remove</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <div class="alert alert-secondary">Your watchlist is empty.</div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
