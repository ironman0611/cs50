{% extends "auctions/layout.html" %}

{% block body %}
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-4">Create Listing</h1>
                    <form action="{% url 'create' %}" method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" name="title" class="form-control" id="title" placeholder="Enter title">
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea name="description" class="form-control" id="description" rows="4" placeholder="Enter description"></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="starting_bid">Starting Bid</label>
                                <input type="number" step="0.01" name="starting_bid" class="form-control" id="starting_bid" placeholder="Enter starting bid">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="category">Category</label>
                                <input type="text" name="category" class="form-control" id="category" placeholder="Enter category">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="image_url">Image URL</label>
                            <input type="url" name="image_url" class="form-control" id="image_url" placeholder="Enter image URL">
                        </div>
                        <div class="d-flex justify-content-end">
                            <button class="btn btn-primary" type="submit" name="button" value="create">Create</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
