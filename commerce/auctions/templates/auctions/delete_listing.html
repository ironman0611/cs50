{% extends "auctions/layout.html" %}

{% block body %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5">Listing Closed</h2>
                    <ul class="list-unstyled small mb-0">
                        <li><strong>Listing:</strong> {{ listing.title }}</li>
                        <li><strong>Owner:</strong> {{ listing.owner }}</li>
                        <li><strong>Created at:</strong> {{ listing.created_at|date:"M j, Y, g:i a" }}</li>
                        <li><strong>Updated at:</strong> {{ listing.updated_at|date:"M j, Y, g:i a" }}</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
